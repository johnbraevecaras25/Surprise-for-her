<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't Click 👁️</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #060606;
      color: white;
      overflow: hidden;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    #creepyScreen {
      position: relative;
      background:
        radial-gradient(circle at center, rgba(90,0,0,.18), transparent 45%),
        linear-gradient(180deg, #050505, #0b0b0b 60%, #020202);
    }

    #creepyScreen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.05) 0,
          rgba(255,255,255,.05) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .creepy-box {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }

    .eye {
      font-size: 66px;
      margin-bottom: 12px;
      animation: pulse 1.8s infinite;
    }

    .creepy-title {
      font-size: clamp(28px, 6vw, 52px);
      letter-spacing: 4px;
      margin: 0 0 10px;
      color: #f1f1f1;
      text-shadow: 0 0 12px rgba(255,0,0,.35);
    }

    .creepy-text {
      color: #a9a9a9;
      font-size: 15px;
      min-height: 24px;
      margin-bottom: 28px;
    }

    .open-btn {
      border: 1px solid #5c1a1a;
      background: #120707;
      color: #f3dcdc;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(120,0,0,.12);
      transition: .2s;
    }

    .open-btn:hover {
      background: #1d0909;
      transform: scale(1.03);
    }

    .warning {
      margin-top: 14px;
      font-size: 12px;
      color: #6f6f6f;
    }

    #revealScreen {
      display: none;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6, #f6ddff);
      color: #5b3343;
    }

    .reveal-wrap {
      width: 100%;
      max-width: 980px;
    }

    .reveal-title {
      color: #d6336c;
      font-size: clamp(28px, 6vw, 50px);
      margin-bottom: 6px;
      animation: pop .7s ease;
    }

    .reveal-subtitle {
      color: #7a4d61;
      margin-bottom: 24px;
    }

    .scene {
      width: 100%;
      height: 420px;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel {
      position: relative;
      width: 220px;
      height: 300px;
      transform-style: preserve-3d;
      animation: rotate 18s linear infinite;
    }

    .carousel img {
      position: absolute;
      inset: 0;
      width: 220px;
      height: 300px;
      object-fit: cover;
      border-radius: 18px;
      border: 5px solid white;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    .carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(330px); }
    .carousel img:nth-child(2) { transform: rotateY(60deg) translateZ(330px); }
    .carousel img:nth-child(3) { transform: rotateY(120deg) translateZ(330px); }
    .carousel img:nth-child(4) { transform: rotateY(180deg) translateZ(330px); }
    .carousel img:nth-child(5) { transform: rotateY(240deg) translateZ(330px); }
    .carousel img:nth-child(6) { transform: rotateY(300deg) translateZ(330px); }

    .message {
      font-size: 18px;
      font-weight: bold;
      color: #c2255c;
      margin-top: 8px;
    }

    .flowers {
      font-size: 34px;
      margin-top: 6px;
    }

    .controls {
      margin-top: 14px;
    }

    .controls button {
      border: 0;
      background: #ff5c8a;
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      margin: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    @keyframes pulse {
      0%,100% { opacity: .55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes pop {
      0% { transform: scale(.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }

    .flash.active {
      animation: flash .45s ease;
    }

    @keyframes flash {
      0% { opacity: 0; }
      40% { opacity: .9; }
      100% { opacity: 0; }
    }

    @media (max-width: 700px) {
      .scene { height: 340px; }

      .carousel {
        width: 150px;
        height: 220px;
      }

      .carousel img {
        width: 150px;
        height: 220px;
      }

      .carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(220px); }
      .carousel img:nth-child(2) { transform: rotateY(60deg) translateZ(220px); }
      .carousel img:nth-child(3) { transform: rotateY(120deg) translateZ(220px); }
      .carousel img:nth-child(4) { transform: rotateY(180deg) translateZ(220px); }
      .carousel img:nth-child(5) { transform: rotateY(240deg) translateZ(220px); }
      .carousel img:nth-child(6) { transform: rotateY(300deg) translateZ(220px); }
    }
  </style>
</head>

<body>

  <div class="flash" id="flash"></div>

  <section class="screen" id="creepyScreen">
    <div class="creepy-box">
      <div class="eye">👁️</div>
      <h1 class="creepy-title">DON'T PANIC</h1>
      <div class="creepy-text" id="creepyText">Something is waiting for you...</div>

      <button class="open-btn" id="openBtn">OPEN IF YOU DARE</button>

      <div class="warning">Warning: may contain something unexpectedly sweet.</div>
    </div>
  </section>

  <section class="screen" id="revealScreen">
    <div class="reveal-wrap">
      <h1 class="reveal-title">SURPRISE ❤️</h1>
      <div class="reveal-subtitle">Hindi pala creepy. Para sa'yo talaga 'to. 🌷</div>

      <div class="scene">
        <div class="carousel" id="carousel">
          <img src="photo1.jpg" alt="Photo 1">
          <img src="photo2.jpg" alt="Photo 2">
          <img src="photo3.jpg" alt="Photo 3">
          <img src="photo4.jpg" alt="Photo 4">
          <img src="photo5.jpg" alt="Photo 5">
          <img src="photo6.jpg" alt="Photo 6">
        </div>
      </div>

      <div class="message">These flowers are for you 🌷💐</div>
      <div class="flowers">🌷🌸🌹🌺🌼🌷</div>

      <div class="controls">
        <button id="pauseBtn">Pause</button>
        <button id="speedBtn">Faster</button>
      </div>
    </div>
  </section>

  <script>
    const creepyText = document.getElementById("creepyText");
    const openBtn = document.getElementById("openBtn");
    const creepyScreen = document.getElementById("creepyScreen");
    const revealScreen = document.getElementById("revealScreen");
    const flash = document.getElementById("flash");
    const carousel = document.getElementById("carousel");
    const pauseBtn = document.getElementById("pauseBtn");
    const speedBtn = document.getElementById("speedBtn");

    const creepyLines = [
      "Something is waiting for you...",
      "Are you sure you want to continue?",
      "Last chance to turn back...",
      "Okay... press the button."
    ];

    let line = 0;

    const textTimer = setInterval(() => {
      line++;

      if (line >= creepyLines.length) {
        clearInterval(textTimer);
        return;
      }

      creepyText.textContent = creepyLines[line];
    }, 1800);

    openBtn.addEventListener("click", function () {
      openBtn.disabled = true;
      openBtn.textContent = "WAIT...";

      creepyText.textContent = "Opening secret file...";

      setTimeout(() => {
        creepyText.textContent = "3...";
      }, 700);

      setTimeout(() => {
        creepyText.textContent = "2...";
      }, 1300);

      setTimeout(() => {
        creepyText.textContent = "1...";
      }, 1900);

      setTimeout(() => {
        flash.classList.add("active");
      }, 2400);

      setTimeout(() => {
        creepyScreen.style.display = "none";
        revealScreen.style.display = "flex";
        document.body.style.overflow = "auto";
      }, 2600);
    });

    let paused = false;
    let fast = false;

    pauseBtn.addEventListener("click", function () {
      paused = !paused;
      carousel.style.animationPlayState = paused ? "paused" : "running";
      pauseBtn.textContent = paused ? "Play" : "Pause";
    });

    speedBtn.addEventListener("click", function () {
      fast = !fast;
      carousel.style.animationDuration = fast ? "8s" : "18s";
      speedBtn.textContent = fast ? "Normal Speed" : "Faster";
    });
  </script>

</body>
</html>
